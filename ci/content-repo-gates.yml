# Citation and link gates for a zettel-bootstrap content repository.
#
# Copy this file into the content repo as .github/workflows/gates.yml, then make
# "gates" a required status check on main (Settings -> Branches -> branch
# protection rule). That is what makes the guarantee real: a maintenance run
# pushes a branch and opens a PR, and unlinted state cannot reach main even if
# the run misbehaves, because the check runs server-side where no session can
# reach it.
#
# The skill repo is public, so no token is needed to fetch the gates.

name: gates

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

env:
  # `main` tracks the skill; pin to a tag or SHA when you want reproducible
  # gates, and bump deliberately.
  ZETTEL_SKILL_REPO: nathanwdavis/auto-zettel-skill
  ZETTEL_SKILL_REF: main

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content repo
        uses: actions/checkout@v4
        with:
          path: content
          # Full history: the skill-sandbox gate diffs against the merge-base
          # with main, which a depth-1 clone cannot compute.
          fetch-depth: 0

      - name: Check out zettel-bootstrap skill
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ZETTEL_SKILL_REPO }}
          ref: ${{ env.ZETTEL_SKILL_REF }}
          path: skill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skill/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skill/requirements.txt

      # verify_refs runs --offline here on purpose: CI re-checks what the run
      # recorded, using the captures committed to raw/. It must not reach the
      # network, so a gate can never pass because of a lucky live lookup.
      - name: Verify references (offline)
        run: python skill/scripts/verify_refs.py --repo content --offline --no-render

      - name: Manifest is current
        run: python skill/scripts/build_manifest.py --repo content --check

      - name: Citation gate
        run: python skill/scripts/lint_citations.py --repo content

      - name: Link gate
        run: python skill/scripts/lint_links.py --repo content

      - name: Skill layer gate
        run: python skill/scripts/lint_skills.py --repo content

      # AC-37, remote half: the wrapper's plugin-tree check does not exist in
      # Mode B (the session IS the agent), so the sandbox invariants bind here,
      # server-side, where no session can reach. The whole-cycle diff must keep
      # log.md and skill-impact.md append-only and raw/ immutable.
      - name: Skill sandbox gate
        run: |
          git -C content fetch -q origin main
          python skill/scripts/check_skill_sandbox.py --repo content \
            --base "$(git -C content merge-base origin/main HEAD)"
